name: Monitoring Daily Digest

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
  # BUG FIX: Removed pull_request trigger — monitoring digest emails
  # were being sent on every PR, which was clearly unintentional.

permissions:
  contents: read
  id-token: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Send monitoring digest
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || 'switchcv-e5136' }}
          # Gmail SMTP (tested working locally)
          SMTP_HOST: "smtp.gmail.com"
          SMTP_PORT: "587"
          SMTP_USER: "switchcvs@gmail.com"
          SMTP_PASS: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_EMAIL_TO: "support@switchcv.com"
          DIGEST_SUBJECT_PREFIX: "[SWITCHCV DIGEST]"
        run: npx tsx scripts/monitoring/daily-digest.ts
