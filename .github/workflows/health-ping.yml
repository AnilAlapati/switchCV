name: Production Health Ping

on:
  schedule:
    # Run every 90 minutes (at minute 0 and 30 of every 3rd hour, offset)
    - cron: "0 */3 * * *"
    - cron: "30 1,4,7,10,13,16,19,22 * * *"
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    env:
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL != '' && secrets.HEALTHCHECK_URL || 'https://switchcv.com/api/health' }}
    steps:
      - name: Call health endpoint
        id: ping
        run: |
          set -euo pipefail
          echo "Pinging $HEALTHCHECK_URL"
          RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 30 "$HEALTHCHECK_URL")
          BODY=$(echo "$RESPONSE" | head -n -1)
          STATUS_CODE=$(echo "$RESPONSE" | tail -n 1)
          echo "body<<'BODY'" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "BODY" >> "$GITHUB_OUTPUT"
          echo "status_code=$STATUS_CODE" >> "$GITHUB_OUTPUT"
          if [ "$STATUS_CODE" -ne 200 ]; then
            echo "::error::Health endpoint returned HTTP $STATUS_CODE"
            echo "$BODY" | jq '.' || echo "$BODY"
            exit 1
          fi
          echo "Health endpoint OK"
          echo "$BODY" | jq '.'

      - name: Publish summary
        run: |
          cat <<'SUMMARY' >> "$GITHUB_STEP_SUMMARY"
          ### /api/health result
          - URL: ${HEALTHCHECK_URL}
          - HTTP Status: ${{ steps.ping.outputs.status_code }}


          ```json
          ${{ steps.ping.outputs.body }}
          ```
          SUMMARY
