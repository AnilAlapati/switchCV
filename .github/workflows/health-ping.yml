name: Production Health Ping
# DISABLED: Saves ~480 GitHub Actions min/month. Use a free external uptime
# monitor instead (UptimeRobot, Better Stack, etc.) which is more reliable
# because it tests from OUTSIDE your infrastructure.
# Re-enable workflow_dispatch below if you need a one-off manual check.

on:
  workflow_dispatch: # Manual trigger only — no scheduled runs

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    env:
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL != '' && secrets.HEALTHCHECK_URL || 'https://switchcv.com/api/health' }}
    steps:
      - name: Call health endpoint
        id: ping
        run: |
          set -euo pipefail
          echo "Pinging $HEALTHCHECK_URL"
          RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 30 "$HEALTHCHECK_URL")
          BODY=$(echo "$RESPONSE" | head -n -1)
          STATUS_CODE=$(echo "$RESPONSE" | tail -n 1)

          # Use a unique delimiter to avoid conflicts with response content
          DELIMITER="BODY_EOF_$(date +%s)"
          {
            echo "body<<${DELIMITER}"
            echo "$BODY"
            echo "${DELIMITER}"
            echo "status_code=$STATUS_CODE"
          } >> "$GITHUB_OUTPUT"

          if [ "$STATUS_CODE" -ne 200 ] && [ "$STATUS_CODE" -ne 503 ]; then
            echo "::error::Health endpoint returned HTTP $STATUS_CODE"
            echo "$BODY" | jq '.' || echo "$BODY"
            exit 1
          fi
          if [ "$STATUS_CODE" -eq 503 ]; then
            echo "::notice::Health endpoint degraded (HTTP 503), but reachable. Likely missing SMTP config."
          else
            echo "Health endpoint OK"
          fi
          echo "$BODY" | jq '.'

      - name: Publish summary
        run: |
          cat <<'SUMMARY' >> "$GITHUB_STEP_SUMMARY"
          ### /api/health result
          - URL: ${HEALTHCHECK_URL}
          - HTTP Status: ${{ steps.ping.outputs.status_code }}


          ```json
          ${{ steps.ping.outputs.body }}
          ```
          SUMMARY
