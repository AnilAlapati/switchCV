name: Deploy to Firebase Hosting on merge
# Automatic deployment disabled - use manual deployment instead
# To re-enable, uncomment the 'on: push' section below
# on:
#   push:
#     branches:
#       - develop
on:
  workflow_dispatch: # Manual trigger only
permissions:
  contents: read
  id-token: write
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci
      - run: npm run build

      - name: Install and Build Functions
        run: |
          cd functions
          npm ci
          npm run build

      - id: "auth"
        uses: "google-github-actions/auth@v2"
        with:
          workload_identity_provider: "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.GCP_SERVICE_ACCOUNT }}"

      - name: Deploy to Firebase
        run: npx firebase-tools deploy --only hosting,functions --project switchcv-e5136
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
