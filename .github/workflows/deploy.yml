name: Deploy to Firebase Hosting on merge
# Automatic deployment disabled - use manual deployment instead
# To re-enable, uncomment the 'on: push' section below
on:
  push:
    branches:
      - develop
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".github/**"
      - "e2e/**"
      - "tests/**"
      - "load-tests/**"
  workflow_dispatch: # Manual trigger also allowed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Functions Dependencies (Cached)
        uses: actions/cache@v4
        id: functions-cache
        with:
          path: functions/node_modules
          key: ${{ runner.os }}-functions-${{ hashFiles('functions/package-lock.json') }}

      - name: Install Functions Deps
        if: steps.functions-cache.outputs.cache-hit != 'true'
        run: cd functions && npm ci

      - name: Build Application and Functions
        run: |
          npm run build &
          (cd functions && npm run build) &
          wait

      - id: "auth"
        uses: "google-github-actions/auth@v2"
        with:
          workload_identity_provider: "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.GCP_SERVICE_ACCOUNT }}"

      - name: Deploy to Firebase
        run: npx firebase-tools deploy --only hosting,functions --project switchcv-e5136
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

  validate_sync:
    name: Validate Environment Sync
    runs-on: ubuntu-latest
    needs: build_and_deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - id: "auth"
        uses: "google-github-actions/auth@v2"
        with:
          workload_identity_provider: "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.GCP_SERVICE_ACCOUNT }}"

      - name: Run Environment Sync Validation
        run: npx tsx scripts/validate-environment-sync.ts --ci
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

      - name: Upload Sync Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environment-sync-report
          path: docs/environment-sync-report.json
          retention-days: 30
