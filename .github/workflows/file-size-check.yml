name: File Size Limit Check

on:
  pull_request:
    paths:
      - "src/**/*.{ts,tsx,js,jsx}"
      - "functions/**/*.{ts,js}"
  push:
    branches:
      - main
      - develop
    paths:
      - "src/**/*.{ts,tsx,js,jsx}"
      - "functions/**/*.{ts,js}"

jobs:
  check-file-sizes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Check file sizes (max 300 lines)
        run: |
          echo "Checking for files exceeding 300 lines..."
          VIOLATIONS=0

          for file in $(find src functions -type f \( -name "*.ts" -o -name "*.tsx" -o -name "*.js" -o -name "*.jsx" \) 2>/dev/null | grep -v node_modules | grep -v .next | grep -v dist | grep -v build); do
            LINES=$(wc -l < "$file" 2>/dev/null || echo 0)
            if [ "$LINES" -gt 300 ]; then
              echo "❌ $file: $LINES lines (exceeds 300)"
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
          done

          if [ $VIOLATIONS -gt 0 ]; then
            echo ""
            echo "❌ Found $VIOLATIONS file(s) exceeding 300 lines"
            echo "Please refactor large files into smaller modules"
            exit 1
          else
            echo "✅ All files are within the 300-line limit"
          fi

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true
