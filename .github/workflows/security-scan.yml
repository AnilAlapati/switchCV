name: Security Scan

on:
  schedule:
    # Run weekly on Mondays at 9 AM UTC
    - cron: "0 9 * * 1"
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch: # Allow manual trigger

jobs:
  dependency-audit:
    name: NPM Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Run npm audit (production only)
        run: npm audit --production --audit-level=high

      - name: Generate audit report
        run: |
          npm audit --json > audit-report.json || true
          echo "## NPM Audit Report" >> $GITHUB_STEP_SUMMARY
          npm audit || echo "Vulnerabilities found - review audit-report.json" >> $GITHUB_STEP_SUMMARY

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit-report
          path: audit-report.json
          retention-days: 30

  security-headers:
    name: Security Headers Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check security headers configuration
        run: |
          # Verify next.config.ts has required headers
          if ! grep -q "Strict-Transport-Security" next.config.ts; then
            echo "❌ Missing HSTS header configuration"
            exit 1
          fi
          if ! grep -q "X-Content-Type-Options" next.config.ts; then
            echo "❌ Missing X-Content-Type-Options header"
            exit 1
          fi
          if ! grep -q "Content-Security-Policy" next.config.ts; then
            echo "❌ Missing CSP header configuration"
            exit 1
          fi
          echo "✅ All required security headers configured"

  summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-audit]
    if: always()
    steps:
      - name: Generate Summary
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "✅ Dependency Audit: ${{ needs.dependency-audit.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Note" >> $GITHUB_STEP_SUMMARY
          echo "CodeQL and Secret Scanning require GitHub Advanced Security (paid) for private repositories." >> $GITHUB_STEP_SUMMARY
          echo "This workflow uses free alternatives: npm audit and Dependabot." >> $GITHUB_STEP_SUMMARY
