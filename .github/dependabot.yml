# Dependabot Configuration

version: 2

updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    # Reduced from 10 to 5 — each open PR triggers a full CI run (~22 min)
    open-pull-requests-limit: 5

    # Grouping strategy
    groups:
      # Group all patch updates together
      patch-updates:
        update-types:
          - "patch"

      # Group minor updates by category
      react-ecosystem:
        patterns:
          - "react*"
          - "@types/react*"
        update-types:
          - "minor"

      firebase-ecosystem:
        patterns:
          - "firebase*"
          - "@firebase/*"
        update-types:
          - "minor"

      next-ecosystem:
        patterns:
          - "next"
          - "next-*"
        update-types:
          - "minor"

      testing-tools:
        patterns:
          - "jest*"
          - "@testing-library/*"
          - "playwright*"
        update-types:
          - "minor"

    # Auto-merge patch updates for non-critical dependencies
    labels:
      - "dependencies"
      - "automated"

    reviewers:
      - "anilalapati" # Replace with actual reviewer

    # Commit message preferences
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

    # Only allow updates that don't break semver
    versioning-strategy: auto

    # Security updates — direct only to reduce PR volume
    # (indirect deps get updated transitively when direct deps update)
    allow:
      - dependency-type: "direct"

  # GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
